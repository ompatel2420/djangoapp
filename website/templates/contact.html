{% extends 'base.html' %}

{% block content %}
<section class="landing-section">
    <div class="section-header">
        <span class="section-badge"><i class="bi bi-envelope"></i> Contact</span>
        <h2 class="section-title">Get in <span class="gradient-text">Touch</span></h2>
        <p class="section-subtitle">Have questions? We'd love to hear from you.</p>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="nexus-card">
                <div class="nexus-card-body p-5">
                    <form method="POST" action="{% url 'contact' %}">
                        {% csrf_token %}
                        <div class="row">
                            <div class="col-md-6 mb-4">
                                <label class="form-label text-muted small fw-bold text-uppercase">Your Name</label>
                                <input type="text" class="form-control nexus-input" placeholder="Enter your name" required>
                            </div>
                            <div class="col-md-6 mb-4">
                                <label class="form-label text-muted small fw-bold text-uppercase">Email Address</label>
                                <input type="email" class="form-control nexus-input" placeholder="Enter your email" required>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label text-muted small fw-bold text-uppercase">Subject</label>
                            <input type="text" class="form-control nexus-input" placeholder="How can we help?">
                        </div>
                        <div class="mb-4">
                            <label class="form-label text-muted small fw-bold text-uppercase">Message</label>
                            <textarea class="form-control nexus-input" rows="5" placeholder="Tell us more about your inquiry..." required></textarea>
                        </div>
                        <div class="text-center">
                            <button type="submit" class="btn btn-nexus-primary btn-lg px-5">
                                <i class="bi bi-send-fill me-2"></i> Send Message
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="row mt-5 text-center">
                <div class="col-md-4">
                    <div class="feature-icon purple mx-auto mb-3"><i class="bi bi-geo-alt"></i></div>
                    <p class="text-secondary fw-bold">Location</p>
                    <p class="text-muted small">Global AI Network</p>
                </div>
                <div class="col-md-4">
                    <div class="feature-icon cyan mx-auto mb-3"><i class="bi bi-envelope"></i></div>
                    <p class="text-secondary fw-bold">Email</p>
                    <p class="text-muted small">hello@aprilfool.project</p>
                </div>
                <div class="col-md-4">
                    <div class="feature-icon green mx-auto mb-3"><i class="bi bi-globe"></i></div>
                    <p class="text-secondary fw-bold">Website</p>
                    <p class="text-muted small">www.aprilfool.project</p>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
