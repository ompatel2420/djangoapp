{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="col-md-5">
        <div class="nexus-card nexus-auth-card">
            <div class="nexus-auth-header text-center">
                <div class="auth-icon-wrapper purple">
                    <i class="bi bi-shield-lock-fill"></i>
                </div>
                <h1>Welcome Back</h1>
                <p>Log in to your AprilFool dashboard</p>
            </div>
            <div class="nexus-auth-body p-4">
                <form method="POST" action="{% url 'login' %}">
                    {% csrf_token %}
                    <div class="mb-4">
                        <label class="form-label text-muted small fw-bold text-uppercase">Username</label>
                        <input type="text" name="username" class="form-control nexus-input" placeholder="Enter your username" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label text-muted small fw-bold text-uppercase">Password</label>
                        <input type="password" name="password" class="form-control nexus-input" placeholder="Enter your password" required>
                    </div>
                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-nexus-primary btn-lg">
                            <i class="bi bi-box-arrow-in-right me-2"></i> Log In
                        </button>
                    </div>
                </form>
            </div>
            <div class="nexus-auth-footer text-center p-3 border-top border-secondary border-opacity-10">
                <p class="text-muted small mb-0">Don't have an account? <a href="{% url 'register' %}" class="text-accent fw-bold text-decoration-none">Register</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
