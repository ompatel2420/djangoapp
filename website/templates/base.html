{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="AprilFool — Premium Customer Relationship Management Dashboard">
    <title>AprilFool — Customer Management</title>

    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <!-- Animated Background -->
    <div class="nexus-bg">
        <div class="grid-overlay"></div>
    </div>

    <div class="nexus-page">
        {% include 'navbar.html' %}

        <!-- Toast Alerts -->
        {% if messages %}
        <div class="nexus-alerts" id="nexusAlerts">
            {% for message in messages %}
            <div class="nexus-alert alert-{{ message.tags }}" role="alert">
                <span class="alert-icon">
                    {% if message.tags == 'success' %}
                        <i class="bi bi-check-circle-fill"></i>
                    {% elif message.tags == 'error' %}
                        <i class="bi bi-exclamation-circle-fill"></i>
                    {% else %}
                        <i class="bi bi-info-circle-fill"></i>
                    {% endif %}
                </span>
                <span>{{ message }}</span>
                <button class="alert-close" onclick="this.parentElement.remove()">
                    <i class="bi bi-x"></i>
                </button>
            </div>
            {% endfor %}
        </div>
        {% endif %}

        <div class="nexus-container">
            {% block content %}
            {% endblock %}
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Auto-dismiss alerts after 5 seconds
        setTimeout(() => {
            const alerts = document.getElementById('nexusAlerts');
            if (alerts) {
                setTimeout(() => alerts.remove(), 5000);
            }
        }, 100);
    </script>
</body>
</html>
