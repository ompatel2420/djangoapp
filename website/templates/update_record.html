{% extends 'base.html' %}

{% block content %}

<div class="nexus-form-wrapper">
    <div class="nexus-card">
        <div class="nexus-card-header">
            <h2><i class="bi bi-pencil-square me-2"></i> Update Record</h2>
            <a href="{% url 'home' %}" class="btn btn-nexus-secondary btn-sm">
                <i class="bi bi-arrow-left me-1"></i> Back
            </a>
        </div>
        <div class="nexus-card-body">
            <form method="POST" id="updateRecordForm">
                {% csrf_token %}
                {{ form.as_p }}
                <div class="mt-4">
                    <button type="submit" class="btn btn-nexus-primary" id="updateRecordSubmit">
                        <i class="bi bi-check-lg me-1"></i> Update Record
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock %}
