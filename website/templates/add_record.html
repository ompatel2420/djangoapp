{% extends 'base.html' %}

{% block content %}

<div class="nexus-form-wrapper">
    <div class="nexus-card">
        <div class="nexus-card-header">
            <h2><i class="bi bi-plus-circle-fill me-2"></i> Add New Record</h2>
            <a href="{% url 'home' %}" class="btn btn-nexus-secondary btn-sm">
                <i class="bi bi-arrow-left me-1"></i> Back
            </a>
        </div>
        <div class="nexus-card-body">
            <form method="POST" action="{% url 'add_record' %}" id="addRecordForm">
                {% csrf_token %}
                {{ form.as_p }}
                <div class="mt-4">
                    <button type="submit" class="btn btn-nexus-primary" id="addRecordSubmit">
                        <i class="bi bi-check-lg me-1"></i> Save Record
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock %}
